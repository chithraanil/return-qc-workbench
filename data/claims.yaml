    order_item_id: OI-REAL-01
    category: Accessories
    item: real_suitcase
    reason: damaged
    text: "Hard-shell burgundy suitcase arrived with a cracked corner."
    value: 14999
    dispatch: [real_suitcase_dispatch.jpg]
    return: [real_suitcase_return.jpg]
    expected: {decision: APPROVE, codes: [PRE_EXISTING_DAMAGE_CLAIM], liable: SELLER}
