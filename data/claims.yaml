# Staged claim cases (balanced: 7 approve, 7 reject, 1 retake). Media paths are relative to data/media/.
# Drop real photos/videos in with these exact names (see data/SHOT_LIST.md).
# expected.* is the ground truth used by the harness scorecard.
defaults:
  currency: INR
  delivered_at: "2026-10-20"
claims:
